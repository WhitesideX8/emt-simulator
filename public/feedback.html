<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMT Scenario Grading Report</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e9ecef;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 30px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    #scenarioTitle {
      text-align: center;
      color: #555;
      margin-top: 0;
    }

    #studentNameDisplay {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin: 8px 0 22px;
    }

    .section {
      background: white;
      border: 1px solid #bbb;
      border-radius: 8px;
      padding: 18px;
      margin: 18px 0;
    }

    .section h2 {
      margin-top: 0;
      border-bottom: 2px solid #333;
      padding-bottom: 6px;
    }

    #feedback,
    #treatmentPlan {
      white-space: pre-wrap;
      line-height: 1.5;
    }

    #feedback { font-size: 16px; }

    #scoreSummary {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-left: 5px solid #176b9e;
      border-radius: 5px;
      background: #f4f7f9;
      font-size: 18px;
      font-weight: bold;
    }

    .input-list {
      display: grid;
      gap: 10px;
    }

    .input-item {
      padding: 11px 13px;
      border-left: 5px solid #176b9e;
      border-radius: 5px;
      background: #f4f7f9;
    }

    .input-heading {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      color: #12304a;
      font-weight: bold;
    }

    .input-time {
      color: #666;
      font-size: 13px;
      font-weight: normal;
    }

    .input-text {
      white-space: pre-wrap;
      line-height: 1.45;
    }

    #studentInputs {
      display: block;
    }

    #studentInputs .input-item {
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      line-height: normal;
    }

    #studentInputs .input-heading {
      display: inline;
      margin: 0;
    }

    #studentInputs .input-time {
      margin-left: 8px;
    }

    #studentInputs .input-text {
      display: inline;
      margin-left: 8px;
      white-space: normal;
      line-height: normal;
      overflow-wrap: anywhere;
    }

    .empty-message {
      color: #666;
      font-style: italic;
    }

    .dispute-form {
      display: grid;
      gap: 12px;
    }

    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #999;
      border-radius: 5px;
      font: inherit;
      min-height: 95px;
      resize: vertical;
    }

    .dispute-btn {
      width: fit-content;
      margin: 0;
      background: #b35a00;
    }

    .dispute-btn:hover {
      background: #823f00;
    }

    .dispute-list {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .dispute-item {
      padding: 13px;
      border-left: 5px solid #b35a00;
      border-radius: 5px;
      background: #fff7ed;
    }

    .dispute-heading {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: bold;
    }

    .dispute-status {
      color: #8a4300;
    }

    .dispute-reason {
      margin-top: 8px;
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .remove-dispute {
      padding: 6px 10px;
      margin: 10px 0 0;
      font-size: 13px;
      background: #9d2020;
    }

    .review-disputes {
      background: #663399;
    }

    .review-disputes:hover {
      background: #48216d;
    }

    .ai-review-note {
      margin-top: 8px;
      padding: 8px;
      border-radius: 4px;
      background: #f3eef8;
      line-height: 1.4;
    }

    #disputeStatus {
      min-height: 20px;
      margin-top: 8px;
      color: #166534;
      font-weight: bold;
    }

    .buttons {
      text-align: center;
      margin-top: 20px;
    }

    button {
      background: green;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: darkgreen; }
    .secondary { background: #333; }
    .secondary:hover { background: #111; }
    .download { background: #176b9e; }
    .download:hover { background: #0f4f78; }

    #downloadStatus {
      min-height: 20px;
      margin-top: 8px;
      text-align: center;
      font-weight: bold;
    }

    body.pdf-mode .buttons,
    body.pdf-mode .dispute-form,
    body.pdf-mode #disputeStatus,
    body.pdf-mode #downloadStatus,
    body.pdf-mode .remove-dispute {
      display: none;
    }

    body.pdf-mode {
      background: white;
    }

    body.pdf-mode .container {
      width: 100%;
      margin: 0;
    }

    @media print {
      .buttons,
      .dispute-form,
      #disputeStatus,
      #downloadStatus,
      .remove-dispute {
        display: none;
      }

      body { background: white; }

      .container {
        width: 100%;
        margin: 0;
      }

      .section {
        break-inside: avoid;
      }
    }

    /* Medical psychomotor skills sheet: follows supplied 2019-11-27 layout */
    #medicalSkillsSheet { overflow-x:auto; margin:12px 0; }
    .medical-form { width:100%; border-collapse:collapse; font-size:12px; color:#111; background:#fff; }
    .medical-form th,.medical-form td { border-bottom:1px solid #555; padding:4px 6px; vertical-align:top; }
    .medical-form .form-title { text-align:center; font-size:16px; font-weight:bold; padding:12px 4px; }
    .medical-form .section-bar td { background:#c9c9c9; font-weight:bold; border:1px solid #555; }
    .medical-form .criterion { width:72%; }
    .medical-form .numeric { width:14%; text-align:center; border-left:1px solid #555; }
    .medical-form .earned { width:14%; text-align:center; border-left:1px solid #555; border-right:1px solid #555; font-weight:bold; }
    .medical-form .status-note { display:block; color:#555; font-weight:normal; font-size:10px; }
    .medical-form .form-footer td { border-top:2px solid #111; font-weight:bold; }
    .medical-form .critical td { font-size:11px; }
    .medical-form .critical-code { width:50px; white-space:nowrap; font-weight:bold; }
    .medical-form .metadata td { border:1px solid #777; }
    .grading-evidence { margin-top:16px; }
    .grading-evidence summary { cursor:pointer; font-weight:bold; }
    .grading-evidence #feedback { white-space:pre-wrap; margin-top:12px; font-size:13px; }
    @media print { .medical-form { font-size:10px; } .medical-form tr { break-inside:avoid; } .grading-evidence { display:none; } }
  </style>
</head>

<body>
  <div class="container">
    <h1>EMT Scenario Grading Report</h1>
    <h2 id="scenarioTitle"></h2>
    <p id="studentNameDisplay"></p>

    <div class="section">
      <h2>Student Treatment Plan</h2>
      <div id="treatmentPlan"></div>
    </div>

    <div class="section">
      <h2>All Student Inputs</h2>
      <div id="studentInputs" class="input-list"></div>
    </div>

    <div class="section">
      <h2>Evaluation</h2>
      <div id="scoreSummary"></div>
      <div id="medicalSkillsSheet"></div>
      <details class="grading-evidence"><summary>Detailed scoring evidence and instructor review</summary><div id="feedback"></div></details>
    </div>

    <div class="section" id="verbalReportSection">
      <h2>Verbal Report Grading</h2>
      <div id="verbalReportScore"></div>

      <h3>Report Transcript</h3>
      <div
        id="verbalReportTranscript"
        style="white-space: pre-wrap; line-height: 1.5;"
      ></div>

      <h3>Verbal Report Checklist</h3>
      <div id="verbalReportChecklist" class="input-list"></div>
    </div>

    <div class="section">
      <h2>Scoring Review</h2>

      <div class="dispute-form">
        <div class="form-group">
          <textarea
            id="disputeReason"
            aria-label="Dispute explanation"
            placeholder="Explain what you entered and where it appears in the student input log."
          ></textarea>
        </div>

        <button
          id="addDisputeButton"
          type="button"
          class="dispute-btn"
        >
          Request Review
        </button>
      </div>

      <div id="disputeStatus" aria-live="polite"></div>
      <div id="disputeList" class="dispute-list"></div>

     </div>

    <div class="buttons">
      <button id="returnButton" type="button">
        Return to Scenario
      </button>

      <button id="printButton" type="button" class="secondary">
        Print Report
      </button>

      <button id="downloadButton" type="button" class="download">
        Download PDF
      </button>

      <button id="homeButton" type="button" class="secondary">
        Home
      </button>

      <div id="downloadStatus" aria-live="polite"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    const STORAGE_KEY = "emtGradingResults";
    const SCENARIO_URL_KEY = "emtCurrentScenarioUrl";

    let gradingData = {};

    function getElement(id) {
      return document.getElementById(id);
    }

    function isScenarioUrl(value) {
      if (!value) return false;

      try {
        const url = new URL(value, window.location.href);
        const page = url.pathname.split("/").pop().toLowerCase();

        const excludedPages = [
          "feedback.html",
          "dispute_review.html",
          "index.html",
          ""
        ];

        return (
          url.origin === window.location.origin &&
          !excludedPages.includes(page)
        );
      } catch (error) {
        return false;
      }
    }

    function rememberCurrentScenario() {
      const returnParameter = new URLSearchParams(
        window.location.search
      ).get("returnTo");

      const savedInResults =
        gradingData.scenarioUrl ||
        gradingData.returnUrl ||
        gradingData.sourcePage;

      const candidates = [
        returnParameter,
        savedInResults,
        document.referrer
      ];

      const scenarioUrl = candidates.find(isScenarioUrl);

      if (scenarioUrl) {
        sessionStorage.setItem(
          SCENARIO_URL_KEY,
          new URL(scenarioUrl, window.location.href).href
        );
      }
    }

    function returnToCurrentScenario() {
      const savedScenarioUrl = sessionStorage.getItem(
        SCENARIO_URL_KEY
      );

      if (isScenarioUrl(savedScenarioUrl)) {
        window.location.href = savedScenarioUrl;
        return;
      }

      if (window.history.length > 1) {
        window.history.back();
        return;
      }

      window.location.href = "index.html";
    }

    function renderStudentInputs(data) {
      const container = getElement("studentInputs");

      let inputs = Array.isArray(data.studentInputLog)
        ? data.studentInputLog
        : [];

      container.replaceChildren();

      if (inputs.length === 0) {
        inputs = [];

        if (Array.isArray(data.assessmentLog)) {
          data.assessmentLog.forEach(function (entry) {
            inputs.push({
              type: "Assessment / Treatment",
              text: entry,
              time: ""
            });
          });
        }

        if (data.patientHistory) {
          inputs.push({
            type: "Patient Interview History",
            text: data.patientHistory,
            time: ""
          });
        }

        if (data.instructorHistory) {
          inputs.push({
            type: "Instructor Interaction History",
            text: data.instructorHistory,
            time: ""
          });
        }
      }

      if (inputs.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = "No student inputs were recorded.";
        container.appendChild(empty);
        return;
      }

      inputs.forEach(function (input, index) {
        const item = document.createElement("div");
        item.className = "input-item";

        const heading = document.createElement("div");
        heading.className = "input-heading";

        const type = document.createElement("span");
        type.textContent =
          (index + 1) + ". " + (input.type || "Student Input");
        heading.appendChild(type);

        if (input.time) {
          const time = document.createElement("span");
          time.className = "input-time";
          time.textContent = input.time;
          heading.appendChild(time);
        }

        const inputText = document.createElement("div");
        inputText.className = "input-text";
        inputText.textContent = input.text || "";

        item.append(heading, inputText);
        container.appendChild(item);
      });
    }

    function saveGradingData() {
      sessionStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(gradingData)
      );
    }

    function renderScore(data) {
      const scoreSummary = getElement("scoreSummary");
      const earnedPoints = Number(data.earnedPoints);
      const possiblePoints = Number(data.possiblePoints);

      if (
        Number.isFinite(earnedPoints) &&
        Number.isFinite(possiblePoints) &&
        possiblePoints > 0
      ) {
        const percentage = Math.round(
          (earnedPoints / possiblePoints) * 100
        );

        scoreSummary.textContent =
          `Score: ${earnedPoints} of ${possiblePoints} points (${percentage}%)`;
        return;
      }

      scoreSummary.textContent = "Score unavailable";
    }

    function removeInstructorComments(feedback) {
      const retainedLines = [];
      let inComments = false;

      for (const line of String(feedback || "").split(/\r?\n/)) {
        const heading = line.trim()
          .replace(/^#{1,6}\s*/, "")
          .replace(/^[*-]\s+/, "")
          .replace(/[*_]/g, "")
          .trim();

        if (
          /^instructor(?:['’]s|s['’]?)?\s+comments?\b\s*(?::|$)/i.test(
            heading
          )
        ) {
          inComments = true;
          continue;
        }

        if (inComments) {
          const nextSection =
            /^(?:overall results?|checklist results?|critical criteria|items missed|completed actions|assessment findings|interventions|vital signs|vitals|verbal report|final score|score summary|recommendations|student treatment plan)\s*:?\s*$/i.test(
              heading
            ) ||
            /^#{1,6}\s+/.test(line.trim());

          if (!nextSection) continue;
          inComments = false;
        }

        retainedLines.push(line);
      }

      return retainedLines.join("\n").trim();
    }

    function removePassFailResult(feedback) {
      if (!feedback) {
        return "No grading feedback available.";
      }

      const retainedLines = [];
      let inOverallResult = false;

      for (const line of String(feedback).split(/\r?\n/)) {
        const heading = line.trim()
          .replace(/^#{1,6}\s*/, "")
          .replace(/^[*-]\s+/, "")
          .replace(/[*_]/g, "")
          .trim();

        if (/^overall\s+results?\b\s*(?::|$)/i.test(heading)) {
          inOverallResult = true;
          continue;
        }

        if (
          inOverallResult &&
          /^(?:checklist result|critical criteria|items missed|instructor comments)\s*:?\s*$/i.test(
            heading
          )
        ) {
          inOverallResult = false;
        }

        if (inOverallResult) continue;

        if (
          /^\s*(?:(?:overall\s+)?(?:result|status|outcome|grade)\s*:\s*)?(?:pass|passed|fail|failed)\s*[.!]?\s*$/i.test(
            line
          )
        ) {
          continue;
        }

        retainedLines.push(line);
      }

      const cleanedFeedback = retainedLines
        .join("\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();

      return (
        cleanedFeedback ||
        "No additional grading feedback available."
      );
    }


    /* Display only: scoring remains authoritative in server.js.
       Unmatched rows are marked REVIEW, never silently assigned zero. */
    const medicalSheetGroups = [
      ["SCENE SIZE-UP", [
        ["Takes or verbalizes appropriate PPE precautions",1,"ppe"],
        ["Determines the scene/situation is safe",1,"scene"],
        ["Determines the mechanism of injury/nature of illness",1,"moi"],
        ["Determines the number of patients",1,"patients"],
        ["Requests additional EMS assistance if necessary",1,"assistance"],
        ["Considers stabilization of the spine",1,"spine"]
      ]],
      ["PRIMARY SURVEY – RESUSCITATION", [
        ["Verbalizes the general impression of the patient",1,"impression"],
        ["Determines responsiveness/level of consciousness",1,"loc"],
        ["Determines chief complaint/apparent life-threats",1,"chief"],
        ["Assesses airway and breathing – Assessment",1,"airway"],
        ["Assures adequate ventilation",1,"ventilation"],
        ["Appropriate oxygen therapy",1,"oxygen"],
        ["Assesses circulation – Pulse",1,"circpulse"],
        ["Assesses circulation – Skin",1,"skin"],
        ["Assesses circulation – Major bleeding",1,"bleeding"],
        ["Identifies patient priority and makes treatment/transport decision",1,"transport"]
      ]],
      ["HISTORY TAKING – HPI", [
        ["Onset",1,"onset"],["Provocation / palliation",1,"provocation"],
        ["Quality",1,"quality"],["Radiation",1,"radiation"],
        ["Severity",1,"severity"],["Time",1,"time"],
        ["Clarifying question 1",1,"clarify1"],["Clarifying question 2",1,"clarify2"]
      ]],
      ["PAST MEDICAL HISTORY (PMH)", [
        ["Allergies",1,"allergies"],["Medications",1,"medications"],
        ["Past pertinent history",1,"history"],["Last oral intake",1,"oral"],
        ["Events leading to illness",1,"events"]
      ]],
      ["SECONDARY ASSESSMENT", [
        ["Level-appropriate assessment of affected body part/system",5,"secondary"]
      ]],
      ["VITAL SIGNS", [
        ["Blood pressure",1,"bp"],["Pulse",1,"vitalpulse"],
        ["Respiratory rate",1,"rr"],["Respiratory quality",1,"rq"],
        ["States field impression",1,"field"],["Interventions & treatment",1,"interventions"]
      ]],
      ["REASSESSMENT", [
        ["Demonstrates how and when to reassess",1,"reassess"],
        ["Provides accurate verbal report to EMS/medical direction/ED",1,"report"]
      ]]
    ];
    const medicalMatch = {
      ppe:/^Takes or verbalizes appropriate PPE precautions:/i,
      scene:/^Determines scene\/situation is safe:/i,
      moi:/^Determines mechanism of injury\/nature of illness:/i,
      patients:/^Determines number of patients:/i,
      assistance:/^Requests additional EMS assistance if necessary:/i,
      spine:/^Considers stabilization of spine:/i,
      impression:/^Verbalizes general impression:/i,
      loc:/^Determines responsiveness\/(?:level of consciousness|LOC)\s*:/i,
      chief:/^Determines chief complaint\/apparent life threats:/i,
      airway:/^Airway and breathing assessment/i,
      ventilation:/^Assures adequate ventilation/i,
      oxygen:/^Appropriate oxygen therapy/i,
      circpulse:/^Circulation: assesses pulse:/i,
      skin:/^Circulation: assesses skin:/i,
      bleeding:/^Circulation: assesses major bleeding:/i,
      transport:/^Identifies patient priority and treatment\/transport decision:/i,
      onset:/^HPI: onset:/i, provocation:/^HPI: provocation\/palliation:/i,
      quality:/^HPI: quality:/i, radiation:/^HPI: radiation:/i,
      severity:/^HPI: severity:/i, time:/^HPI: time /i,
      clarify1:/^HPI: clarifying question 1:/i,
      clarify2:/^HPI: clarifying question 2:/i,
      allergies:/^PMH: allergies:/i, medications:/^PMH: medications:/i,
      history:/^PMH: past pertinent history:/i,
      oral:/^PMH: last oral intake:/i, events:/^PMH: events leading to illness:/i,
      secondary:/^Level-appropriate assessment of affected body part\/system:/i,
      bp:/^Vital signs: blood pressure:/i, vitalpulse:/^Vital signs: pulse:/i,
      rr:/^Vital signs: respiratory rate:/i, rq:/^Vital signs: respiratory quality:/i,
      field:/^States field impression:/i,
      interventions:/^Interventions and treatment:/i,
      reassess:/^Demonstrates how and when to reassess:/i,
      report:/^Provides accurate verbal report to EMS\/medical direction\/ED:/i
    };
    function renderMedicalSheet(data) {
      const root = getElement("medicalSkillsSheet");
      root.replaceChildren();
      const table = document.createElement("table");
      table.className = "medical-form";
      const body = document.createElement("tbody");
      table.appendChild(body);
      const row = (values, cls="") => {
        const tr=document.createElement("tr"); if(cls) tr.className=cls;
        values.forEach((v,i)=>{const td=document.createElement("td");td.textContent=v;
          if(i===0)td.className="criterion"; else td.className=i===1?"numeric":"earned";
          tr.appendChild(td);});body.appendChild(tr);return tr;
      };
      let tr=document.createElement("tr");let td=document.createElement("td");
      td.colSpan=3;td.className="form-title";td.textContent="PATIENT ASSESSMENT/MANAGEMENT – MEDICAL";
      tr.appendChild(td);body.appendChild(tr);
      tr=row(["Candidate: "+(data.studentName||sessionStorage.getItem("emtStudentName")||"Not entered"),
        "Scenario: "+(data.scenario||"EMT Scenario"),"Examiner: __________"],"metadata");
      tr=row(["Date: "+new Date().toLocaleDateString(),"Points Possible","Points Awarded"]);
      const lines=String(data.feedback||"").split(/\r?\n/).map(s=>s.trim());
      let matched=0;
      medicalSheetGroups.forEach(([heading,items])=>{
        const bar=document.createElement("tr");bar.className="section-bar";
        const c=document.createElement("td");c.colSpan=3;c.textContent=heading;bar.appendChild(c);body.appendChild(bar);
        items.forEach(([label,max,key])=>{
          const pattern=medicalMatch[key];const line=pattern&&lines.find(l=>pattern.test(l));
          const score=line&&line.match(/:\s*(\d+)\s*\/\s*(\d+)/);
          const status=line&&line.match(/\[([^\]]+)\]/);
          const tr=row([label,String(max),score?score[1]:"—"]);
          if(line){matched++;if(status){const note=document.createElement("small");note.className="status-note";note.textContent=status[1].replaceAll("_"," ");tr.cells[2].appendChild(note);}}
          else {const note=document.createElement("small");note.className="status-note";note.textContent="Review / not mapped";tr.cells[2].appendChild(note);}
        });
      });
      const final=row(["SERVER-REPORTED TOTAL",String(Number.isFinite(Number(data.possiblePoints))?data.possiblePoints:"—"),
        String(Number.isFinite(Number(data.earnedPoints))?data.earnedPoints:"—")],"form-footer");
      const note=document.createElement("tr");const n=document.createElement("td");n.colSpan=3;
      n.textContent="This is the layout of the supplied skills sheet. Points and statuses come from the existing server report; missing mappings require review. The server-reported total controls (the supplied paper form shows 42 possible points).";
      note.appendChild(n);body.appendChild(note);
      const bar=document.createElement("tr");bar.className="section-bar";
      const b=document.createElement("td");b.colSpan=3;b.textContent="CRITICAL CRITERIA – SEPARATE EVALUATION";bar.appendChild(b);body.appendChild(bar);
      const criteria=[
        "Failure to initiate or call for transport within 15 minutes",
        "Failure to take or verbalize appropriate PPE precautions",
        "Failure to determine scene safety before approaching patient",
        "Failure to provide oxygen therapy in line with AHA guidelines",
        "Failure to find or manage airway, breathing, hemorrhage or shock problems, if present",
        "Failure to differentiate immediate transport from continued scene care",
        "Failure to manage life threats before other care",
        "Orders a dangerous or inappropriate intervention",
        "Failure to provide accurate report to arriving EMS/medical direction/ED",
        "Failure to manage the patient as a competent EMT*",
        "Exhibits unacceptable affect with patient or other personnel*",
        "Failure to earn minimum of 33 points"
      ];
      criteria.forEach((label,i)=>{
        const code="F"+(i+1);const rx=new RegExp("^"+code+":\\s*(PASS|FAIL|REVIEW)","i");
        const hit=lines.find(l=>rx.test(l));
        const status=hit?hit.match(rx)[1].toUpperCase():"REVIEW";
        row([code+"  "+label,"—",status],"critical");
      });
      const foot=document.createElement("tr");const f=document.createElement("td");f.colSpan=3;
      f.textContent="* Critical criteria require immediate Chief Examiner notification. Critical criteria are not added to the numerical score. Examiner must document rationale for any checked critical item.";
      foot.appendChild(f);body.appendChild(foot);
      root.appendChild(table);
    }

    function renderDisputes() {
      const container = getElement("disputeList");

      const disputes = Array.isArray(gradingData.scoringDisputes)
        ? gradingData.scoringDisputes
        : [];

      container.replaceChildren();

      if (disputes.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent =
          "No scoring disputes have been entered.";
        container.appendChild(empty);
        return;
      }

      disputes.forEach(function (dispute, index) {
        const item = document.createElement("div");
        item.className = "dispute-item";

        const heading = document.createElement("div");
        heading.className = "dispute-heading";

        const title = document.createElement("span");
        title.textContent =
          (index + 1) + ". " + dispute.item;

        const status = document.createElement("span");
        status.className = "dispute-status";
        status.textContent =
          dispute.status || "Pending instructor review";

        const reason = document.createElement("div");
        reason.className = "dispute-reason";
        reason.textContent =
          "Student explanation: " + dispute.reason;

        const submitted = document.createElement("div");
        submitted.className = "input-time";
        submitted.textContent =
          "Submitted: " +
          (dispute.submittedAt || "Time unavailable");

        const aiNote = document.createElement("div");
        aiNote.className = "ai-review-note";

        if (dispute.aiReview) {
          aiNote.textContent =
            "AI recommendation prepared for instructor review: " +
            String(
              dispute.aiReview.recommendation || "Needs review"
            ).replaceAll("_", " ");
        } else if (dispute.aiReviewError) {
          aiNote.textContent =
            "AI review unavailable; the instructor can still decide manually.";
        } else {
          aiNote.textContent = "AI review pending.";
        }

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-dispute";
        remove.textContent = "Remove Dispute";

        remove.addEventListener("click", function () {
          removeDispute(index);
        });

        heading.append(title, status);
        item.append(heading, reason, submitted, aiNote, remove);
        container.appendChild(item);
      });
    }

    async function addDispute() {
      const reasonInput = getElement("disputeReason");
      const statusBox = getElement("disputeStatus");

      const item = "Scoring dispute";
      const reason = reasonInput.value.trim();

      if (!reason) {
        statusBox.textContent =
          "Enter the reason for the dispute.";
        statusBox.style.color = "#9d2020";
        return;
      }

      if (!Array.isArray(gradingData.scoringDisputes)) {
        gradingData.scoringDisputes = [];
      }

      const dispute = {
        id:
          "dispute-" +
          Date.now() +
          "-" +
          Math.random().toString(16).slice(2),
        item,
        reason,
        status: "Pending instructor review",
        submittedAt: new Date().toLocaleString()
      };

      gradingData.scoringDisputes.push(dispute);

      saveGradingData();
      renderDisputes();

      reasonInput.value = "";

      statusBox.style.color = "#166534";
      statusBox.textContent =
        "Dispute saved. Preparing the AI recommendation...";

      try {
        const response = await fetch("/review-dispute", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            dispute,
            scenario: gradingData.scenario,
            earnedPoints:
              gradingData.originalEarnedPoints ??
              gradingData.earnedPoints,
            possiblePoints: gradingData.possiblePoints,
            checklist: gradingData.checklist,
            studentInputLog: gradingData.studentInputLog,
            treatmentPlan: gradingData.treatmentPlan
          })
        });

        const review = await response.json();

        if (!response.ok) {
          throw new Error(review.error || "Review failed");
        }

        dispute.aiReview = review;

        statusBox.textContent =
          "AI recommendation prepared. An instructor must make the final decision.";
      } catch (error) {
        dispute.aiReviewError = error.message;
        statusBox.style.color = "#9d2020";
        statusBox.textContent =
          "Dispute saved, but AI review was unavailable. The instructor can review it manually.";
      }

      saveGradingData();
      renderDisputes();
    }

    function removeDispute(index) {
      if (!Array.isArray(gradingData.scoringDisputes)) return;

      gradingData.scoringDisputes.splice(index, 1);
      saveGradingData();
      renderDisputes();

      getElement("disputeStatus").textContent =
        "Scoring dispute removed.";
    }

    function openDisputeReview() {
      if (
        !Array.isArray(gradingData.scoringDisputes) ||
        gradingData.scoringDisputes.length === 0
      ) {
        getElement("disputeStatus").textContent =
          "Add at least one scoring dispute first.";
        return;
      }

      window.location.href = "dispute_review.html";
    }

    function createPdfFilename() {
      const scenarioName =
        gradingData.scenario || "EMT-Scenario";

      const safeName = scenarioName
        .replace(/[^a-z0-9]+/gi, "-")
        .replace(/^-+|-+$/g, "") || "EMT-Scenario";

      return `${safeName}-Grading-Report.pdf`;
    }

    async function downloadReportAsPdf() {
      const statusBox = getElement("downloadStatus");
      const downloadButton = getElement("downloadButton");

      if (typeof html2pdf === "undefined") {
        statusBox.style.color = "#9d2020";
        statusBox.textContent =
          "The PDF tool did not load. Check the internet connection and try again.";
        return;
      }

      downloadButton.disabled = true;
      statusBox.style.color = "#166534";
      statusBox.textContent = "Preparing PDF...";

      document.body.classList.add("pdf-mode");

      const options = {
        margin: [0.35, 0.35, 0.35, 0.35],
        filename: createPdfFilename(),
        image: {
          type: "jpeg",
          quality: 0.98
        },
        html2canvas: {
          scale: 2,
          useCORS: true,
          backgroundColor: "#ffffff",
          scrollX: 0,
          scrollY: 0
        },
        jsPDF: {
          unit: "in",
          format: "letter",
          orientation: "portrait"
        },
        pagebreak: {
          mode: ["css", "legacy"],
          avoid: ["h1", "h2", "h3"]
        }
      };

      try {
        await html2pdf()
          .set(options)
          .from(document.querySelector(".container"))
          .save();

        statusBox.textContent = "PDF downloaded.";
      } catch (error) {
        console.error("PDF download failed:", error);
        statusBox.style.color = "#9d2020";
        statusBox.textContent =
          "The PDF could not be created. Please try Print Report instead.";
      } finally {
        document.body.classList.remove("pdf-mode");
        downloadButton.disabled = false;
      }
    }

    function renderVerbalReport(data = {}) {
      const score = getElement("verbalReportScore");
      const transcript = getElement("verbalReportTranscript");
      const list = getElement("verbalReportChecklist");

      list.replaceChildren();

      let grade;

      try {
        const grades = JSON.parse(
          sessionStorage.getItem("emtVerbalReportGrades") || "{}"
        );

        let code = data.scenarioCode;

        if (!code && data.scenarioUrl) {
          const page = new URL(
            data.scenarioUrl,
            location.href
          ).pathname;

          code = /sob/i.test(page)
            ? "sob"
            : /stroke/i.test(page)
              ? "stroke"
              : /diabetic/i.test(page)
                ? "diabetic"
                : "chestPain";
        }

        grade = grades[code || "chestPain"];

        const state = JSON.parse(
          sessionStorage.getItem(
            "emtScenarioState:" + (code || "chestPain")
          ) || "{}"
        );

        if (
          grade &&
          grade.caseSessionId &&
          state.caseSessionId &&
          grade.caseSessionId !== state.caseSessionId
        ) {
          grade = null;
        }
      } catch (error) {
        grade = null;
      }

      if (!grade) {
        score.textContent =
          "No scored verbal report is available for this scenario. Select Score Report on the verbal-report page first.";
        transcript.textContent = "";
        return;
      }

      const percentage = Math.round(
        grade.earnedPoints / grade.possiblePoints * 100
      );

      score.textContent =
        `Verbal report score: ${grade.earnedPoints} of ${grade.possiblePoints} points (${percentage}%)`;

      transcript.textContent = grade.transcript || "";

      for (const item of grade.checklist || []) {
        const row = document.createElement("div");
        row.className = "input-item";

        row.textContent =
          `${item.pass ? "✓" : "✗"} ${item.name}: ` +
          `${item.pass ? "Reported" : "Not recognized"} ` +
          `(${item.pass ? 1 : 0}/1)`;

        list.appendChild(row);
      }
    }

    function loadReport() {
      const savedData = sessionStorage.getItem(STORAGE_KEY);

      if (!savedData) {
        getElement("scenarioTitle").textContent =
          "No Scenario Results";

        renderScore({});
        renderMedicalSheet({});

        getElement("feedback").textContent =
          "No grading information was found. Please complete a scenario first.";

        renderVerbalReport({});
        renderStudentInputs({});
        renderDisputes();
        return;
      }

      try {
        gradingData = JSON.parse(savedData);

        const studentName =
          gradingData.studentName ||
          sessionStorage.getItem("emtStudentName") ||
          "";

        getElement("studentNameDisplay").textContent =
          studentName
            ? "Student: " + studentName
            : "Student: Name not entered";

        rememberCurrentScenario();

        getElement("scenarioTitle").textContent =
          gradingData.scenario || "EMT Scenario";

        getElement("treatmentPlan").textContent =
          gradingData.treatmentPlan || "No treatment plan entered.";

        renderScore(gradingData);
        renderMedicalSheet(gradingData);

        getElement("feedback").textContent =
          removePassFailResult(
            removeInstructorComments(gradingData.feedback)
          );

        renderVerbalReport(gradingData);
        renderStudentInputs(gradingData);
        renderDisputes();
      } catch (error) {
        gradingData = {};

        getElement("scenarioTitle").textContent =
          "Invalid Scenario Results";

        renderScore({});
        renderMedicalSheet({});

        getElement("feedback").textContent =
          "The saved grading information could not be read.";

        renderVerbalReport({});
        renderStudentInputs({});
        renderDisputes();
      }
    }

    getElement("addDisputeButton").addEventListener(
      "click",
      addDispute
    );


    getElement("returnButton").addEventListener(
      "click",
      returnToCurrentScenario
    );

    getElement("printButton").addEventListener(
      "click",
      function () {
        window.print();
      }
    );

    getElement("downloadButton").addEventListener(
      "click",
      downloadReportAsPdf
    );

    getElement("homeButton").addEventListener(
      "click",
      function () {
        window.location.href = "index.html";
      }
    );

    window.addEventListener("focus", function () {
      renderVerbalReport(gradingData);
    });

    loadReport();
  </script>
</body>
</html>
