<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMT Scenario Grading Report</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #e9ecef; color: #222; }
    .container { width: 90%; max-width: 1000px; margin: 30px auto; }
    h1 { text-align: center; margin-bottom: 5px; }
    #scenarioTitle { text-align: center; color: #555; margin-top: 0; }
    #studentNameDisplay { text-align: center; font-size: 18px; font-weight: bold; margin: 8px 0 22px; }
    .section { background: white; border: 1px solid #bbb; border-radius: 8px; padding: 18px; margin: 18px 0; }
    .section h2 { margin-top: 0; border-bottom: 2px solid #333; padding-bottom: 6px; }
    #feedback, #treatmentPlan { white-space: pre-wrap; line-height: 1.5; }
    #feedback { font-size: 16px; }
    #scoreSummary { margin-bottom: 14px; padding: 12px 14px; border-left: 5px solid #176b9e; border-radius: 5px; background: #f4f7f9; font-size: 18px; font-weight: bold; }
    .input-list { display: grid; gap: 10px; }
    .input-item { padding: 11px 13px; border-left: 5px solid #176b9e; border-radius: 5px; background: #f4f7f9; }
    .input-heading { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 5px; color: #12304a; font-weight: bold; }
    .input-time { color: #666; font-size: 13px; font-weight: normal; }
    .input-text { white-space: pre-wrap; line-height: 1.45; }
    .empty-message { color: #666; font-style: italic; }
    .dispute-help { margin: 0 0 14px; line-height: 1.45; color: #444; }
    .dispute-form { display: grid; gap: 12px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input,
    .form-group textarea { width: 100%; padding: 10px; border: 1px solid #999; border-radius: 5px; font: inherit; }
    .form-group textarea { min-height: 95px; resize: vertical; }
    .dispute-btn { width: fit-content; margin: 0; background: #b35a00; }
    .dispute-btn:hover { background: #823f00; }
    .dispute-list { display: grid; gap: 12px; margin-top: 18px; }
    .dispute-item { padding: 13px; border-left: 5px solid #b35a00; border-radius: 5px; background: #fff7ed; }
    .dispute-heading { display: flex; justify-content: space-between; gap: 10px; font-weight: bold; }
    .dispute-status { color: #8a4300; }
    .dispute-reason { margin-top: 8px; white-space: pre-wrap; line-height: 1.45; }
    .remove-dispute { padding: 6px 10px; margin: 10px 0 0; font-size: 13px; background: #9d2020; }
    .review-disputes { background: #663399; }
    .review-disputes:hover { background: #48216d; }
    .ai-review-note { margin-top: 8px; padding: 8px; border-radius: 4px; background: #f3eef8; line-height: 1.4; }
    #disputeStatus { min-height: 20px; margin-top: 8px; color: #166534; font-weight: bold; }
    .buttons { text-align: center; margin-top: 20px; }
    button { background: green; color: white; border: none; border-radius: 6px; padding: 10px 18px; margin: 5px; font-size: 16px; cursor: pointer; }
    button:hover { background: darkgreen; }
    .secondary { background: #333; }
    .secondary:hover { background: #111; }
    .download { background: #176b9e; }
    .download:hover { background: #0f4f78; }
    #downloadStatus { min-height: 20px; margin-top: 8px; text-align: center; font-weight: bold; }
    body.pdf-mode .buttons,
    body.pdf-mode .dispute-form,
    body.pdf-mode .dispute-help,
    body.pdf-mode #disputeStatus,
    body.pdf-mode #downloadStatus,
    body.pdf-mode .remove-dispute { display: none; }
    body.pdf-mode { background: white; }
    body.pdf-mode .container { width: 100%; margin: 0; }
    @media print {
      .buttons, .dispute-form, .dispute-help, #disputeStatus, #downloadStatus, .remove-dispute { display: none; }
      body { background: white; }
      .container { width: 100%; margin: 0; }
      .section { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>EMT Scenario Grading Report</h1>
    <h2 id="scenarioTitle"></h2>
    <p id="studentNameDisplay"></p>

    <div class="section">
      <h2>Student Treatment Plan</h2>
      <div id="treatmentPlan"></div>
    </div>

    <div class="section">
      <h2>All Student Inputs</h2>
      <div id="studentInputs" class="input-list"></div>
    </div>

    <div class="section">
      <h2>Evaluation</h2>
      <div id="scoreSummary"></div>
      <div id="feedback"></div>
    </div>

    <div class="section">
      <h2>Scoring Disputes</h2>
      <p class="dispute-help">
        If you believe a scoring point was missed, identify the item and explain what you entered or did that supports receiving credit.
      </p>

      <div class="dispute-form">
        <div class="form-group">
          <label for="disputeItem">Scoring item being disputed</label>
          <input id="disputeItem" type="text" placeholder="Example: Blood pressure assessed" />
        </div>

        <div class="form-group">
          <label for="disputeReason">Reason for dispute</label>
          <textarea id="disputeReason" placeholder="Explain what you entered and where it appears in the student input log."></textarea>
        </div>

        <button id="addDisputeButton" type="button" class="dispute-btn">Add Dispute</button>
      </div>

      <div id="disputeStatus" aria-live="polite"></div>
      <div id="disputeList" class="dispute-list"></div>
      <div class="buttons">
        <button id="reviewDisputesButton" type="button" class="review-disputes">Open Instructor Dispute Report</button>
      </div>
    </div>

    <div class="buttons">
      <button id="returnButton" type="button">Return to Scenario</button>
      <button id="printButton" type="button" class="secondary">Print Report</button>
      <button id="downloadButton" type="button" class="download">Download PDF</button>
      <button id="homeButton" type="button" class="secondary">Home</button>
      <div id="downloadStatus" aria-live="polite"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    const STORAGE_KEY = "emtGradingResults";
    const SCENARIO_URL_KEY = "emtCurrentScenarioUrl";
    let gradingData = {};

    function getElement(id) {
      return document.getElementById(id);
    }

    function isScenarioUrl(value) {
      if (!value) return false;

      try {
        const url = new URL(value, window.location.href);
        const page = url.pathname.split("/").pop().toLowerCase();
        const excludedPages = ["feedback.html", "dispute_review.html", "index.html", ""];

        return url.origin === window.location.origin && !excludedPages.includes(page);
      } catch (error) {
        return false;
      }
    }

    function rememberCurrentScenario() {
      const returnParameter = new URLSearchParams(window.location.search).get("returnTo");
      const savedInResults = gradingData.scenarioUrl || gradingData.returnUrl || gradingData.sourcePage;
      const referringPage = document.referrer;
      const candidates = [returnParameter, savedInResults, referringPage];

      const scenarioUrl = candidates.find(isScenarioUrl);
      if (scenarioUrl) {
        sessionStorage.setItem(SCENARIO_URL_KEY, new URL(scenarioUrl, window.location.href).href);
      }
    }

    function returnToCurrentScenario() {
      const savedScenarioUrl = sessionStorage.getItem(SCENARIO_URL_KEY);

      if (isScenarioUrl(savedScenarioUrl)) {
        window.location.href = savedScenarioUrl;
        return;
      }

      if (window.history.length > 1) {
        window.history.back();
        return;
      }

      window.location.href = "index.html";
    }

    function renderStudentInputs(data) {
      const container = getElement("studentInputs");
      let inputs = Array.isArray(data.studentInputLog) ? data.studentInputLog : [];

      container.replaceChildren();

      // Show older saved reports even if they predate the chronological log.
      if (inputs.length === 0) {
        inputs = [];

        if (Array.isArray(data.assessmentLog)) {
          data.assessmentLog.forEach(function (entry) {
            inputs.push({ type: "Assessment / Treatment", text: entry, time: "" });
          });
        }

        if (data.patientHistory) {
          inputs.push({ type: "Patient Interview History", text: data.patientHistory, time: "" });
        }

        if (data.instructorHistory) {
          inputs.push({ type: "Instructor Interaction History", text: data.instructorHistory, time: "" });
        }
      }

      if (inputs.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = "No student inputs were recorded.";
        container.appendChild(empty);
        return;
      }

      inputs.forEach(function (input, index) {
        const item = document.createElement("div");
        item.className = "input-item";

        const heading = document.createElement("div");
        heading.className = "input-heading";

        const type = document.createElement("span");
        type.textContent = (index + 1) + ". " + (input.type || "Student Input");
        heading.appendChild(type);

        if (input.time) {
          const time = document.createElement("span");
          time.className = "input-time";
          time.textContent = input.time;
          heading.appendChild(time);
        }

        const inputText = document.createElement("div");
        inputText.className = "input-text";
        inputText.textContent = input.text || "";

        item.append(heading, inputText);
        container.appendChild(item);
      });
    }

    function saveGradingData() {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(gradingData));
    }

    function renderScore(data) {
      const scoreSummary = getElement("scoreSummary");
      const earnedPoints = Number(data.earnedPoints);
      const possiblePoints = Number(data.possiblePoints);

      if (Number.isFinite(earnedPoints) && Number.isFinite(possiblePoints) && possiblePoints > 0) {
        const percentage = Math.round((earnedPoints / possiblePoints) * 100);
        scoreSummary.textContent = `Score: ${earnedPoints} of ${possiblePoints} points (${percentage}%)`;
        return;
      }

      scoreSummary.textContent = "Score unavailable";
    }

    function removePassFailResult(feedback) {
      if (!feedback) return "No grading feedback available.";

      const cleanedFeedback = String(feedback)
        .split("\n")
        .filter(function (line) {
          return !/^\s*(?:(?:overall\s+)?(?:result|status|outcome|grade)\s*:\s*)?(?:pass|passed|fail|failed)\s*[.!]?\s*$/i.test(line);
        })
        .join("\n")
        .replace(/\n{3,}/g, "\n\n")
        .trim();

      return cleanedFeedback || "No additional grading feedback available.";
    }

    function renderDisputes() {
      const container = getElement("disputeList");
      const disputes = Array.isArray(gradingData.scoringDisputes)
        ? gradingData.scoringDisputes
        : [];

      container.replaceChildren();

      if (disputes.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = "No scoring disputes have been entered.";
        container.appendChild(empty);
        return;
      }

      disputes.forEach(function (dispute, index) {
        const item = document.createElement("div");
        item.className = "dispute-item";

        const heading = document.createElement("div");
        heading.className = "dispute-heading";

        const title = document.createElement("span");
        title.textContent = (index + 1) + ". " + dispute.item;

        const status = document.createElement("span");
        status.className = "dispute-status";
        status.textContent = dispute.status || "Pending instructor review";

        const reason = document.createElement("div");
        reason.className = "dispute-reason";
        reason.textContent = "Student explanation: " + dispute.reason;

        const submitted = document.createElement("div");
        submitted.className = "input-time";
        submitted.textContent = "Submitted: " + (dispute.submittedAt || "Time unavailable");

        const aiNote = document.createElement("div");
        aiNote.className = "ai-review-note";
        if (dispute.aiReview) {
          aiNote.textContent = "AI recommendation prepared for instructor review: " +
            String(dispute.aiReview.recommendation || "Needs review").replaceAll("_", " ");
        } else if (dispute.aiReviewError) {
          aiNote.textContent = "AI review unavailable; the instructor can still decide manually.";
        } else {
          aiNote.textContent = "AI review pending.";
        }

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-dispute";
        remove.textContent = "Remove Dispute";
        remove.addEventListener("click", function () {
          removeDispute(index);
        });

        heading.append(title, status);
        item.append(heading, reason, submitted, aiNote, remove);
        container.appendChild(item);
      });
    }

    async function addDispute() {
      const itemInput = getElement("disputeItem");
      const reasonInput = getElement("disputeReason");
      const statusBox = getElement("disputeStatus");
      const item = itemInput.value.trim();
      const reason = reasonInput.value.trim();

      if (!item || !reason) {
        statusBox.textContent = "Enter both the scoring item and the reason for the dispute.";
        statusBox.style.color = "#9d2020";
        return;
      }

      if (!Array.isArray(gradingData.scoringDisputes)) {
        gradingData.scoringDisputes = [];
      }

      const dispute = {
        id: "dispute-" + Date.now() + "-" + Math.random().toString(16).slice(2),
        item,
        reason,
        status: "Pending instructor review",
        submittedAt: new Date().toLocaleString()
      };

      gradingData.scoringDisputes.push(dispute);

      saveGradingData();
      renderDisputes();
      itemInput.value = "";
      reasonInput.value = "";
      statusBox.style.color = "#166534";
      statusBox.textContent = "Dispute saved. Preparing the AI recommendation...";

      try {
        const response = await fetch("/review-dispute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            dispute: dispute,
            scenario: gradingData.scenario,
            earnedPoints: gradingData.originalEarnedPoints ?? gradingData.earnedPoints,
            possiblePoints: gradingData.possiblePoints,
            checklist: gradingData.checklist,
            studentInputLog: gradingData.studentInputLog,
            treatmentPlan: gradingData.treatmentPlan
          })
        });

        const review = await response.json();
        if (!response.ok) throw new Error(review.error || "Review failed");
        dispute.aiReview = review;
        statusBox.textContent = "AI recommendation prepared. An instructor must make the final decision.";
      } catch (error) {
        dispute.aiReviewError = error.message;
        statusBox.style.color = "#9d2020";
        statusBox.textContent = "Dispute saved, but AI review was unavailable. The instructor can review it manually.";
      }

      saveGradingData();
      renderDisputes();
    }

    function removeDispute(index) {
      if (!Array.isArray(gradingData.scoringDisputes)) return;
      gradingData.scoringDisputes.splice(index, 1);
      saveGradingData();
      renderDisputes();
      getElement("disputeStatus").textContent = "Scoring dispute removed.";
    }

    function openDisputeReview() {
      if (!Array.isArray(gradingData.scoringDisputes) || gradingData.scoringDisputes.length === 0) {
        getElement("disputeStatus").textContent = "Add at least one scoring dispute first.";
        return;
      }
      window.location.href = "dispute_review.html";
    }

    function createPdfFilename() {
      const scenarioName = gradingData.scenario || "EMT-Scenario";
      const safeName = scenarioName
        .replace(/[^a-z0-9]+/gi, "-")
        .replace(/^-+|-+$/g, "") || "EMT-Scenario";

      return `${safeName}-Grading-Report.pdf`;
    }

    async function downloadReportAsPdf() {
      const statusBox = getElement("downloadStatus");
      const downloadButton = getElement("downloadButton");

      if (typeof html2pdf === "undefined") {
        statusBox.style.color = "#9d2020";
        statusBox.textContent = "The PDF tool did not load. Check the internet connection and try again.";
        return;
      }

      downloadButton.disabled = true;
      statusBox.style.color = "#166534";
      statusBox.textContent = "Preparing PDF...";
      document.body.classList.add("pdf-mode");

      const options = {
        margin: [0.35, 0.35, 0.35, 0.35],
        filename: createPdfFilename(),
        image: { type: "jpeg", quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
        jsPDF: { unit: "in", format: "letter", orientation: "portrait" },
        pagebreak: { mode: ["css", "legacy"], avoid: [".section", ".input-item", ".dispute-item"] }
      };

      try {
        await html2pdf().set(options).from(document.querySelector(".container")).save();
        statusBox.textContent = "PDF downloaded.";
      } catch (error) {
        console.error("PDF download failed:", error);
        statusBox.style.color = "#9d2020";
        statusBox.textContent = "The PDF could not be created. Please try Print Report instead.";
      } finally {
        document.body.classList.remove("pdf-mode");
        downloadButton.disabled = false;
      }
    }

    function loadReport() {
      const savedData = sessionStorage.getItem(STORAGE_KEY);

      if (!savedData) {
        getElement("scenarioTitle").textContent = "No Scenario Results";
        renderScore({});
        getElement("feedback").textContent = "No grading information was found. Please complete a scenario first.";
        renderStudentInputs({});
        renderDisputes();
        return;
      }

      try {
        gradingData = JSON.parse(savedData);
        const studentName = gradingData.studentName || sessionStorage.getItem("emtStudentName") || "";
        getElement("studentNameDisplay").textContent = studentName
          ? "Student: " + studentName
          : "Student: Name not entered";
        rememberCurrentScenario();
        getElement("scenarioTitle").textContent = gradingData.scenario || "EMT Scenario";
        getElement("treatmentPlan").textContent = gradingData.treatmentPlan || "No treatment plan entered.";
        renderScore(gradingData);
        getElement("feedback").textContent = removePassFailResult(gradingData.feedback);
        renderStudentInputs(gradingData);
        renderDisputes();
      } catch (error) {
        gradingData = {};
        getElement("scenarioTitle").textContent = "Invalid Scenario Results";
        renderScore({});
        getElement("feedback").textContent = "The saved grading information could not be read.";
        renderStudentInputs({});
        renderDisputes();
      }
    }

    getElement("addDisputeButton").addEventListener("click", addDispute);
    getElement("reviewDisputesButton").addEventListener("click", openDisputeReview);
    getElement("returnButton").addEventListener("click", returnToCurrentScenario);
    getElement("printButton").addEventListener("click", function () {
      window.print();
    });
    getElement("downloadButton").addEventListener("click", downloadReportAsPdf);
    getElement("homeButton").addEventListener("click", function () {
      window.location.href = "index.html";
    });

    loadReport();
  </script>
</body>
</html>
