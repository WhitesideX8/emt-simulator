<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMT Simulation Scenarios</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url('https://raw.githubusercontent.com/WhitesideX8/emt-simulator/main/public/IMG_0989.jpg') no-repeat center center fixed;
      background-size: cover;
      text-align: center;
      color: white;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      padding-top: 40px;
    }
    .name-field {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 20px;
      text-align: left;
    }
    .name-field input {
      width: 150px;
      max-width: 70vw;
      padding: 6px 8px;
      font: inherit;
      border: 0;
      border-radius: 6px;
      background: #d3d3d3;
    }
    h1 {
      margin-bottom: 40px;
      font-size: 42px;
    }
    .scenario-link {
      display: block;
      box-sizing: border-box;
      width: 300px;
      margin: 15px auto;
      padding: 15px;
      font-size: 20px;
      background: green;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }
    .scenario-link:hover { background: darkgreen; }
  </style>
</head>
<body>
  <div class="name-field">
    <input id="studentName" type="text" aria-label="Student name" placeholder="Enter your name" autocomplete="name" />
  </div>
  <div class="container">
    <h1>EMT Simulation Scenarios</h1>
    <a class="scenario-link" href="chestpain2.html">Scenario #1</a>
    <a class="scenario-link" href="sob.html">Scenario #2</a>
    <a class="scenario-link" href="stroke.html">Scenario #3</a>
    <a class="scenario-link" href="diabetic.html">Scenario #4</a>
  </div>
  <script>
    const nameInput = document.getElementById("studentName");
    nameInput.value = sessionStorage.getItem("emtStudentName") || "";
    nameInput.addEventListener("input", () => {
      sessionStorage.setItem("emtStudentName", nameInput.value.trim());
    });
    document.querySelectorAll(".scenario-link").forEach(link => {
      link.addEventListener("click", () => {
        sessionStorage.setItem("emtStudentName", nameInput.value.trim());
      });
    });
  </script>
</body>
</html>
